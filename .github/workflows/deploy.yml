name: Deploy Forex Bot to GitHub Pages

on:
  push:
    branches: [master]
    paths: [forex-bot/**]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: forex-bot/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: forex-bot

      - name: Build
        run: npm run build
        working-directory: forex-bot

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: forex-bot/build

      - uses: actions/deploy-pages@v4
        id: deployment
